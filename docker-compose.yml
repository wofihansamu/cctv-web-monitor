services:
  go2rtc:
    image: docker.io/alexxit/go2rtc:latest
    container_name: cctv-go2rtc
    network_mode: host          # host net = easiest RTSP discovery + WebRTC on LAN
    restart: always             # with podman, also enable podman-restart.service to start on boot
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro

  web:
    build: .
    container_name: cctv-web
    network_mode: host
    restart: always
    environment:
      - PORT=8900
      - GO2RTC_URL=http://localhost:1984
      - GO2RTC_PUBLIC_URL=http://localhost:1984
      - REC_DIR=/app/recordings
      - REC_SEGMENT_SEC=600     # clip length in seconds
      - REC_MAX_DAYS=7          # auto-delete footage older than this
      - REC_MAX_GB=0            # 0 = no size cap; set e.g. 50 to cap total
      - ARCHIVE_EVERY_MIN=60    # pull camera SD -> server every hour
      - FORMAT_EVERY_HOURS=24   # safe auto-format cadence
      - AUTO_FORMAT=1           # 0 disables all auto-format
    volumes:
      - ./cameras.json:/app/cameras.json
      - ./recordings:/app/recordings
    depends_on:
      - go2rtc

  # X-IOT P2P camera bridge (optional). Runs the vendor arm64 P2P stack under
  # qemu plus a static x86_64 ffmpeg, transcodes the camera's MJPEG to H.264 and
  # pushes it into go2rtc. Enable with:  docker compose --profile p2p up -d
  # Prereqs (see p2p/README.md): build xiot-bionic:arm64 + the harness, and copy
  # p2p/secrets.example.env -> p2p/secrets.env. STREAM_NAME must match the camera
  # id in cameras.json AND an empty stream declared in go2rtc.yaml.
  p2p-bridge:
    profiles: ["p2p"]
    build:
      context: ./p2p
      dockerfile: Dockerfile.bridge
    image: xiot-bridge:latest
    container_name: cctv-xiot-bridge
    network_mode: host
    restart: always
    env_file:
      - ./p2p/secrets.env
    environment:
      - STREAM_NAME=xiotcam
    depends_on:
      - go2rtc
